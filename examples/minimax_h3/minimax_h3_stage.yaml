stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: video
    runtime:
      process: true
      devices: "0-63"
      max_batch_size: 1
    engine_args:
      model_class_name: MiniMaxH3Pipeline
      model_stage: diffusion
      dtype: bfloat16
      # MiniMax-H3's released frames are the blended-tile ones.
      vae_use_tiling: true
      # The video sigma shift; the audio shift (3.0) comes from audio_scheduler/.
      flow_shift: 12.0
      # The engine's dummy request is 512x512 / 1 step, a graph no real request uses; the
      # pipeline runs its own warmup instead (MINIMAX_H3_WARMUP).
      skip_warmup: true
      parallel_config:
        # 56 attention heads: TP is 1, 2, 4, 7 or 8. Past 8 cores, ring_degree shards the
        # packed sequence (context parallelism).
        tensor_parallel_size: 8
        ring_degree: 8
